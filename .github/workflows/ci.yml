name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check app migrations scripts tests

      - name: Compile
        run: python -m compileall -q app migrations scripts

      - name: Tests
        run: pytest -q

      # ONE-TIME diagnostic for PR 61 only; remove after inspecting result.
      # Read-only; one public search page per portal, no DB and no details.
      # Never treat a 403/CAPTCHA, empty budget or card-only results as success.
      - name: PR 61 German public portal live smoke (non-blocking)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 61 }}
        continue-on-error: true
        run: |
          STATUS=0
          python -m scripts.inspect_public_portals_de --provider ohne-makler-de --frontier de-mecklenburg-vorpommern --verify-details --max-detail-checks 2 || STATUS=1
          python -m scripts.inspect_public_portals_de --provider immobilien-de --frontier de-public-frontier --verify-details --max-detail-checks 2 || STATUS=1
          exit "$STATUS"
