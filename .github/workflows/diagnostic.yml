name: DE branch diagnostics

on:
  pull_request:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          ruff check app migrations scripts tests > ruff.txt 2>&1
          echo $? > ruff.exit
          python -m compileall -q app migrations scripts > compile.txt 2>&1
          echo $? > compile.exit
          pytest -q > pytest.txt 2>&1
          echo $? > pytest.exit
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-branch-diagnostics
          path: |
            ruff.txt
            ruff.exit
            compile.txt
            compile.exit
            pytest.txt
            pytest.exit
